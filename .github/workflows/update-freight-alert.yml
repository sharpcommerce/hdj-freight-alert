name: Update Freight Alert

# Rebuilds freight-alert.user.js from live Shopify data. When the freight
# list changes, it commits a new version and Tampermonkey auto-updates every
# installed copy within a day.

on:
  schedule:
    - cron: "0 13 * * *"      # daily at 13:00 UTC (~6am PT). Adjust as you like.
  workflow_dispatch: {}         # lets you run it on demand from the Actions tab.

permissions:
  contents: write               # needed to commit the regenerated file.

concurrency:
  group: freight-alert
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check the Shopify credentials are configured
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          if [[ -z "$SHOPIFY_CLIENT_SECRET" ]]; then
            echo "::error title=Missing SHOPIFY_CLIENT_SECRET::The repo secret SHOPIFY_CLIENT_SECRET is not set, so the freight list cannot be refreshed and the sales team's alert is frozen at its last build. Copy it from Shopify Dev Dashboard > Freight Alert Sync > App settings > Credentials > Secret, and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Credentials present."

      - name: Regenerate freight list
        env:
          SHOPIFY_STORE: hollywood-djmi
          # Client ID is not a secret - Shopify documents it as safe to expose.
          # The Secret below is what protects it.
          SHOPIFY_CLIENT_ID: cf066c5a37ca317b4f31abf6434b9777
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node generate.mjs

      - name: Commit if changed
        run: |
          # last-checked.json changes every run; it is the heartbeat that proves
          # this job is still alive. freight-alert.user.js only changes when the
          # freight list itself changed.
          if [[ -n "$(git status --porcelain freight-alert.user.js last-checked.json)" ]]; then
            git config user.name  "freight-alert-bot"
            git config user.email "actions@github.com"
            git add freight-alert.user.js last-checked.json
            if [[ -n "$(git diff --cached --name-only -- freight-alert.user.js)" ]]; then
              git commit -m "Auto-update freight list ($(date -u +%Y-%m-%d))"
            else
              git commit -m "Freight list checked, no change ($(date -u +%Y-%m-%d))"
            fi
            git push
            echo "Pushed."
          else
            echo "Nothing to commit."
          fi
